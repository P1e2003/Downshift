name: Downshift CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner & linter
        run: python -m pip install --upgrade pip pytest ruff

      - name: Run Ruff format & lint check
        run: |
          ruff format --check scripts/ tests/ benchmarks/
          ruff check scripts/ tests/ benchmarks/

      - name: Run unit, CLI, telemetry, and manifest tests
        run: pytest -v

      - name: Run 20-scenario routing accuracy & latency benchmark
        run: python benchmarks/run_benchmark.py

